name: CI/CD Pipeline - Mayte Anchapanta

on:
  push:
    branches:
      - mayte_anchapanta
  pull_request:
    branches:
      - mayte_anchapanta

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Descargar el código del repositorio
    - name: 🧾 Checkout repository
      uses: actions/checkout@v3
    
    # 2. Configurar Python
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    # 3. Instalar dependencias
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # 4. Ejecutar tests
    - name: 🧪 Run tests
      run: |
        pytest test_app.py -v
    
    # 5. Login a GitHub Container Registry
    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    # 6. Construir y publicar imagen Docker
    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/mayte-anchapanta:latest
          ghcr.io/${{ github.repository }}/mayte-anchapanta:${{ github.sha }}
